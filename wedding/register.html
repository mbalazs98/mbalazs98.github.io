---
layout: none
permalink: /wedding/register/
sitemap: false
---
<!doctype html>
<html lang="en">
<head>
  {% include wedding_head.liquid %}
</head>
<body>
  <main class="page">
    {% include wedding_header.liquid active="register" %}

    <section id="step-register">
      <h2 data-i18n="reg.title">Registration</h2>
      <p data-i18n="reg.intro"></p>

      <form id="register-form" novalidate>
        <div class="person">
          <div>
            <label><span data-i18n="reg.family">Family name</span>
              <input type="text" name="family" autocomplete="family-name" maxlength="80" required>
            </label>
          </div>
          <div>
            <label><span data-i18n="reg.first">First name</span>
              <input type="text" name="first" autocomplete="given-name" maxlength="80" required>
            </label>
          </div>
          <div class="wide">
            <label><span data-i18n="reg.email">Email (optional)</span>
              <input type="email" name="email" autocomplete="email" maxlength="120">
            </label>
            <p class="note" data-i18n="reg.emailNote"></p>
          </div>
          <div class="wide">
            <label><span data-i18n="reg.allergies">Allergies or dietary requirements (optional)</span>
              <input type="text" name="allergies" maxlength="300">
            </label>
          </div>
          <div class="wide accom">
            <label><input type="checkbox" name="accommodation"> <span data-i18n="reg.accom">I will need help with accommodation</span></label>
            <p class="note" data-i18n="reg.accomNote"></p>
          </div>
        </div>
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" class="primary" data-i18n="reg.submit">Send registration</button>
        <p class="status" id="status" role="status"></p>
      </form>
    </section>

    <section id="step-network" hidden>
      <p class="status ok" id="welcome"></p>
      <h2 data-i18n="net.title">Who do you know?</h2>
      <p data-i18n="net.intro"></p>
      <input type="text" id="net-filter" class="filter" data-i18n-placeholder="net.search" autocomplete="off">
      <ul class="pick" id="net-list"></ul>
      <p class="count" id="net-empty" hidden></p>
      <button type="button" class="primary" id="net-save" data-i18n="net.save">Save</button>
      <p class="status" id="net-status" role="status"></p>
      <p class="note" data-i18n="net.later"></p>
      <button type="button" class="link" id="register-other" data-i18n="reg.other">Register someone else</button>
    </section>
  </main>
</body>
</html>
