<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <meta name="robots" content="noindex, nofollow"> <title>Laurette &amp; Balázs</title> <link rel="icon" href="data:image/svg+xml,&lt;svg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22&gt;&lt;text%20y=%22.9em%22%20font-size=%2290%22&gt;%F0%9F%92%90&lt;/text&gt;&lt;/svg&gt;"> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&amp;display=swap" rel="stylesheet"> <link rel="stylesheet" href="/wedding/wedding.css?v=1793011286"> <script src="/wedding/wedding.js?v=1793011286" defer></script> </head> <body> <main class="page"> <header> <div class="topbar"> <nav> <a href="/wedding/" data-i18n="nav.home">Home</a> <a href="/wedding/register/" data-i18n="nav.register" aria-current="page">Registration</a> <a href="/wedding/attendees/" data-i18n="nav.attendees">Guests</a> </nav> <div class="lang-switch" role="group" aria-label="Language / Nyelv"> <button type="button" data-lang="hu">HU</button> <button type="button" data-lang="en">EN</button> </div> </div> <p class="date" data-i18n="date">5 June 2027</p> <div class="title-row"> <h1>Laurette &amp; <span class="groom"><span>Balázs</span><span>Mészi</span></span> </h1> <label class="name-switch"> <span>Balázs</span> <input type="checkbox" id="name-toggle" role="switch"> <span class="track" aria-hidden="true"></span> <span>Mészi</span> </label> </div> </header> <section id="step-register"> <h2 data-i18n="reg.title">Registration</h2> <p data-i18n="reg.intro"></p> <form id="register-form" novalidate> <div class="person"> <div> <label><span data-i18n="reg.family">Family name</span> <input type="text" name="family" autocomplete="family-name" maxlength="80" required> </label> </div> <div> <label><span data-i18n="reg.first">First name</span> <input type="text" name="first" autocomplete="given-name" maxlength="80" required> </label> </div> <div class="wide"> <label><span data-i18n="reg.email">Email (optional)</span> <input type="email" name="email" autocomplete="email" maxlength="120"> </label> <p class="note" data-i18n="reg.emailNote"></p> </div> <div class="wide"> <label><span data-i18n="reg.allergies">Allergies or dietary requirements (optional)</span> <input type="text" name="allergies" maxlength="300"> </label> </div> <div class="wide accom"> <label><input type="checkbox" name="accommodation"> <span data-i18n="reg.accom">I will need help with accommodation</span></label> <p class="note" data-i18n="reg.accomNote"></p> </div> </div> <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"> <button type="submit" class="primary" data-i18n="reg.submit">Send registration</button> <p class="status" id="status" role="status"></p> </form> </section> <section id="step-network" hidden> <p class="status ok" id="welcome"></p> <h2 data-i18n="net.title">Who do you know?</h2> <p data-i18n="net.intro"></p> <input type="text" id="net-filter" class="filter" data-i18n-placeholder="net.search" autocomplete="off"> <ul class="pick" id="net-list"></ul> <p class="count" id="net-empty" hidden></p> <button type="button" class="primary" id="net-save" data-i18n="net.save">Save</button> <p class="status" id="net-status" role="status"></p> <p class="note" data-i18n="net.later"></p> <button type="button" class="link" id="register-other" data-i18n="reg.other">Register someone else</button> </section> </main> </body> </html>
